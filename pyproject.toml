[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "family-travel-planner"
version = "1.0.0"
description = "Universal Multi-Generational Family Travel Planning Skill & Artifact Generator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-docx>=1.1.0",
    "Pillow>=10.0.0",
    "jinja2>=3.1.2",
    "markdown>=3.5.0"
]
